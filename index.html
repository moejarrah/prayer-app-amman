<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="مواقيت الصلاة"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <title>مواقيت الصلاة</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="prayers-data.js"></script>

  <style>
    :root {
      --sky-top: #1a1a2e;
      --sky-mid: #16213e;
      --sky-low: #0f3460;
      --surface: rgba(255,255,255,0.06);
      --surface-strong: rgba(255,255,255,0.1);
      --text: #e8e8f0;
      --text-dim: #9aa4b6;
      --accent: #e8b860;
      --accent-glow: rgba(232,184,96,0.3);
      --overlay: rgba(0,0,0,0.3);
      --prayer-bg: rgba(255,255,255,0.04);
      --prayer-active-bg: rgba(232,184,96,0.15);
      --prayer-active-border: rgba(232,184,96,0.4);
      --countdown-bg: rgba(0,0,0,0.35);
      --transition: 0.8s ease;
    }

    body.dawn {
      --sky-top: #1a1a3e;
      --sky-mid: #2d1b69;
      --sky-low: #c44b2b;
      --accent: #e8965e;
      --accent-glow: rgba(232,150,94,0.4);
      --prayer-active-bg: rgba(232,150,94,0.15);
      --prayer-active-border: rgba(232,150,94,0.4);
    }

    body.morning {
      --sky-top: #4a90d9;
      --sky-mid: #87ceeb;
      --sky-low: #ffe4b5;
      --accent: #f0a050;
      --accent-glow: rgba(240,160,80,0.4);
      --text: #2d3436;
      --text-dim: #636e72;
      --surface: rgba(0,0,0,0.04);
      --surface-strong: rgba(0,0,0,0.08);
      --prayer-bg: rgba(0,0,0,0.03);
      --prayer-active-bg: rgba(240,160,80,0.15);
      --prayer-active-border: rgba(240,160,80,0.4);
      --countdown-bg: rgba(255,255,255,0.6);
      --overlay: rgba(255,255,255,0.15);
    }

    body.midday {
      --sky-top: #5b9bd5;
      --sky-mid: #87ceeb;
      --sky-low: #e8d5b7;
      --accent: #e8a040;
      --accent-glow: rgba(232,160,64,0.35);
      --text: #2d3436;
      --text-dim: #636e72;
      --surface: rgba(0,0,0,0.04);
      --surface-strong: rgba(0,0,0,0.08);
      --prayer-bg: rgba(0,0,0,0.03);
      --prayer-active-bg: rgba(232,160,64,0.15);
      --prayer-active-border: rgba(232,160,64,0.4);
      --countdown-bg: rgba(255,255,255,0.7);
      --overlay: rgba(255,255,255,0.1);
    }

    body.afternoon {
      --sky-top: #d4a54a;
      --sky-mid: #e8c56a;
      --sky-low: #f5d580;
      --accent: #c8862e;
      --accent-glow: rgba(200,134,46,0.4);
      --text: #3d3020;
      --text-dim: #6b5d4a;
      --surface: rgba(0,0,0,0.05);
      --surface-strong: rgba(0,0,0,0.1);
      --prayer-bg: rgba(0,0,0,0.04);
      --prayer-active-bg: rgba(200,134,46,0.2);
      --prayer-active-border: rgba(200,134,46,0.5);
      --countdown-bg: rgba(255,255,255,0.6);
      --overlay: rgba(255,255,255,0.08);
    }

    body.maghrib {
      --sky-top: #2c1654;
      --sky-mid: #6b2440;
      --sky-low: #e8743c;
      --accent: #f08050;
      --accent-glow: rgba(240,128,80,0.45);
      --prayer-active-bg: rgba(240,128,80,0.15);
      --prayer-active-border: rgba(240,128,80,0.4);
    }

    body.night {
      --sky-top: #0a0a1a;
      --sky-mid: #111130;
      --sky-low: #1a1a3e;
      --accent: #c8c0e0;
      --accent-glow: rgba(200,192,224,0.3);
      --prayer-active-bg: rgba(200,192,224,0.12);
      --prayer-active-border: rgba(200,192,224,0.3);
    }

    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html {
      height:100%; overflow:hidden;
      background:#0a0a1a;
    }
    body {
      min-height:100vh; min-height:-webkit-fill-available;
      overflow-x:hidden;
      display:flex; flex-direction:column; position:relative;
      font-family:'Cairo','IBM Plex Sans Arabic',sans-serif;
      background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
      transition:background 0.8s ease;
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
    }

    .sky-overlay {
      position:fixed; top:0;left:0;right:0;bottom:0; pointer-events:none; z-index:0;
      background: var(--overlay);
      transition:background var(--transition);
      padding-bottom:env(safe-area-inset-bottom);
    }

    .stars {
      position:fixed; top:0;left:0;right:0; bottom:65%; pointer-events:none; z-index:0;
      opacity:0; transition:opacity var(--transition);
    }
    .stars.show { opacity:1; }
    .sun-glow {
      position:fixed; top:5%;left:50%;transform:translateX(-50%);
      width:120px;height:120px;border-radius:50%; pointer-events:none; z-index:0;
      background:radial-gradient(circle, rgba(255,220,100,0.7) 0%, rgba(255,180,50,0.3) 40%, transparent 70%);
      opacity:0; transition:opacity var(--transition);
    }
    .sun-glow.show { opacity:1; }
    .moon-icon {
      position:fixed; top:6%;right:12%; pointer-events:none; z-index:0;
      font-size:3rem; opacity:0; transition:opacity var(--transition);
    }
    .moon-icon.show { opacity:0.7; }

    .header {
      position:relative; z-index:2;
      padding:16px 16px 10px; padding-top:calc(16px + env(safe-area-inset-top));
      text-align:center;
      display:flex;align-items:center;justify-content:center; flex-shrink:0;
    }
    .header h1 { font-size:1.2rem; font-weight:700; letter-spacing:0.5px; }
    .header .city-btn {
      position:absolute; left:56px; top:50%; transform:translateY(-50%);
      font-size:0.72rem; padding:8px 14px; border-radius:20px; min-height:44px;
      border:1px solid var(--surface-strong); background:var(--surface);
      color:var(--text); cursor:pointer; -webkit-appearance:none;
      font-weight:600; font-family:inherit;
      transition:background 0.2s,border-color 0.2s;
    }
    .header .city-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .header .share-btn {
      position:absolute; left:8px; top:50%; transform:translateY(-50%);
      width:44px; height:44px; border-radius:50%;
      border:1px solid var(--surface-strong); background:var(--surface);
      color:var(--text); cursor:pointer; -webkit-appearance:none;
      display:flex; align-items:center; justify-content:center;
      font-family:inherit;
      transition:background 0.2s,border-color 0.2s;
    }
    .header .share-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

    .main-scroll {
      flex:1; overflow-y:auto; padding:0 14px calc(90px + env(safe-area-inset-bottom));
      -webkit-overflow-scrolling:touch; position:relative; z-index:2;
    }

    .hero { text-align:center; padding:16px 0 8px; }
    .hero .current-name {
      font-size:2.4rem; font-weight:800; letter-spacing:1px;
      text-shadow:0 2px 20px var(--accent-glow);
      margin-bottom:4px;
    }
    .hero .countdown {
      font-size:1.5rem; font-weight:700;
      background:var(--countdown-bg); border-radius:16px;
      padding:10px 24px; display:inline-block;
      margin-top:8px; backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      font-variant-numeric:tabular-nums;
      font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;
    }
    .hero .next-label {
      font-size:0.72rem; color:var(--text-dim); margin-top:6px;
    }

    .today-grid {
      display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
      margin:16px 0;
    }
    .prayer-cell {
      background:var(--prayer-bg); border:1px solid var(--surface-strong);
      border-radius:14px; padding:12px 8px; text-align:center;
      transition:background 0.3s,border-color 0.3s,box-shadow 0.3s,transform 0.15s;
      backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      cursor:pointer; min-height:68px;
      display:flex; flex-direction:column; justify-content:center;
    }
    .prayer-cell:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .prayer-cell.active {
      background:rgba(255,255,255,0.12);
      border-color:rgba(255,255,255,0.25);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1), 0 0 24px -4px var(--accent-glow);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      transform:scale(1.02);
    }
    body.morning .prayer-cell.active,
    body.midday .prayer-cell.active,
    body.afternoon .prayer-cell.active {
      background:rgba(0,0,0,0.08);
      border-color:rgba(0,0,0,0.15);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,0.06), 0 0 24px -4px var(--accent-glow);
    }
    .prayer-cell .p-name {
      font-size:0.7rem; color:var(--text-dim); margin-bottom:4px;
    }
    .prayer-cell.active .p-name { color:var(--accent); }
    .prayer-cell .p-time {
      font-size:1.25rem; font-weight:700;
      font-variant-numeric:tabular-nums;
      font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;
    }
    .prayer-cell .p-label {
      display:block; font-size:0.58rem; color:var(--accent);
      margin-top:2px; font-weight:600;
    }

    .hijri-date {
      text-align:center; font-size:0.8rem; color:var(--text-dim);
      margin-bottom:12px; direction:rtl;
    }

    .bottom-nav {
      position:fixed; bottom:0;left:0;right:0; z-index:10;
      background:var(--countdown-bg); border-top:1px solid var(--surface-strong);
      display:flex; padding:6px 8px; gap:4px;
      padding-bottom:max(6px, env(safe-area-inset-bottom));
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      justify-content:space-around;
    }
    .bottom-nav button {
      flex:1; padding:10px 6px; border-radius:12px; border:none;
      background:transparent; color:var(--text-dim);
      font-size:0.72rem; font-weight:600; cursor:pointer;
      transition:background 0.2s,color 0.2s; -webkit-appearance:none;
      display:flex; flex-direction:column; align-items:center; gap:3px;
      min-height:44px; font-family:inherit;
    }
    .bottom-nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .bottom-nav button.active { color:var(--accent); }
    .bottom-nav button .nav-icon svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

    .month-nav {
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 4px 12px;
    }
    .month-nav .month-label { font-size:1rem; font-weight:700; }
    .month-nav button {
      width:44px; height:44px; border-radius:50%;
      border:1px solid var(--surface-strong); background:var(--surface);
      color:var(--text); font-size:1.1rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      -webkit-appearance:none; font-family:inherit;
      transition:background 0.2s,border-color 0.2s;
    }
    .month-nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .cal-grid {
      display:grid; grid-template-columns:repeat(7,1fr);
      gap:3px; text-align:center;
    }
    .cal-dow {
      font-size:0.62rem; color:var(--text-dim); font-weight:600;
      padding:6px 0;
    }
    .cal-cell {
      min-height:52px; border-radius:10px; font-size:0.72rem; font-weight:600;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      cursor:pointer; background:var(--surface);
      border:1px solid var(--surface-strong);
      transition:background 0.15s,border-color 0.15s; color:var(--text); padding:3px 2px;
      position:relative; font-family:inherit;
    }
    .cal-cell:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .cal-cell:active { background:var(--prayer-active-bg); }
    .cal-cell.empty { background:transparent; border-color:transparent; pointer-events:none; }
    .cal-cell.today { border-color:var(--accent); }
    .cal-cell .cal-fajr {
      font-size:0.48rem; color:var(--text-dim); margin-top:1px;
      font-variant-numeric:tabular-nums;
      font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;
    }
    .cal-legend {
      display:flex; gap:16px; justify-content:center; padding:14px 0;
      font-size:0.68rem; color:var(--text-dim);
    }

    .sheet-backdrop {
      position:fixed; top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,0.5); z-index:20;
      opacity:0; pointer-events:none; transition:opacity 0.25s;
    }
    .sheet-backdrop.open { opacity:1; pointer-events:auto; }
    .city-sheet {
      position:fixed; bottom:0;left:0;right:0; z-index:21;
      background:var(--sky-top); border-radius:18px 18px 0 0;
      padding:20px 18px 28px;
      box-shadow:0 -6px 30px rgba(0,0,0,0.4);
      transform:translateY(100%); transition:transform 0.3s ease;
      max-height:70vh; overflow-y:auto;
    }
    .city-sheet.open { transform:translateY(0); }
    .city-sheet h3 { font-size:1rem; margin-bottom:12px; color:var(--text); }
    .city-sheet .city-option {
      display:block; width:100%; padding:14px; margin-bottom:6px;
      border-radius:12px; border:1px solid var(--surface-strong);
      background:var(--surface); color:var(--text);
      font-size:0.88rem; font-weight:600; cursor:pointer;
      -webkit-appearance:none; text-align:right; font-family:inherit;
    }
    .city-sheet .city-option.selected {
      border-color:var(--accent); background:var(--prayer-active-bg);
    }
    .city-sheet .sheet-close {
      display:block; margin:12px auto 0; padding:12px 40px;
      border-radius:24px; border:none; background:var(--surface-strong);
      color:var(--text); font-size:0.85rem; font-weight:700;
      cursor:pointer; -webkit-appearance:none; font-family:inherit;
      min-height:44px;
    }

    .refresh-bar {
      text-align:center; font-size:0.65rem; color:var(--text-dim);
      padding:8px; opacity:0.6;
    }
    .refresh-bar a { color:inherit; text-decoration:underline; }

    .loading { text-align:center; padding:40px; color:var(--text-dim); }
  </style>
</head>
<body id="body">

  <div class="sky-overlay"></div>
  <div class="stars" id="stars"></div>
  <div class="sun-glow"></div>
  <div class="moon-icon">🌙</div>

  <div class="header">
    <h1>مواقيت الصلاة</h1>
    <span class="city-btn" onclick="openCitySheet()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openCitySheet()}" id="cityBtn" role="button" tabindex="0" aria-label="معلومات المدينة">عمّان</span>
    <button class="share-btn" onclick="shareApp()" title="مشاركة" aria-label="مشاركة التطبيق">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    </button>
  </div>

  <div class="main-scroll" id="mainScroll">
    <noscript><p style="text-align:center;padding:40px;color:#e8e8f0;">يجب تفعيل JavaScript لتشغيل هذا التطبيق</p></noscript>
  </div>

  <div class="bottom-nav">
    <button onclick="switchTab('today')" id="btnToday" class="active" aria-label="مواقيت اليوم"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.09 3.26L16 6l-2.91.74L12 10l-1.09-3.26L8 6l2.91-.74L12 2zM12 14l1.09 3.26L16 18l-2.91.74L12 22l-1.09-3.26L8 18l2.91-.74L12 14z"/></svg></span>اليوم</button>
    <button onclick="switchTab('month')" id="btnMonth" aria-label="عرض الشهر"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg></span>الشهر</button>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeCitySheet()"></div>
  <div class="city-sheet" id="citySheet">
    <h3>عمّان - وزارة الأوقاف الأردنية</h3>
    <p style="color:var(--text-dim);padding:12px;text-align:center;line-height:1.7;">البيانات من موقع الوزارة الرسمي<br>تغطي 215 يوماً حتى نهاية 2026<br>تعمل بدون إنترنت بعد التحميل الأول</p>
    <p style="color:var(--accent);padding:4px 12px;text-align:center;font-size:0.75rem;font-weight:600;">📱 للإضافة للشاشة الرئيسية:<br>• آيفون: شارك ← أضف للشاشة الرئيسية<br>• أندرويد: الثلاث نقاط ← أضف للشاشة الرئيسية</p>
    <button class="sheet-close" onclick="closeCitySheet()">تم</button>
  </div>

<script>
const PRAYER_MAP = {};
if (typeof PRAYER_DATA !== 'undefined') {
  PRAYER_DATA.forEach(p => {
    const normalized = normalizeTimes(p);
    PRAYER_MAP[normalized.date] = normalized;
  });
}

function normalizeTimes(entry) {
  const pmKeys = ['dhuhr', 'asr', 'maghrib', 'isha'];
  const out = { ...entry };
  pmKeys.forEach(key => {
    if (out[key]) {
      const parts = out[key].split(':');
      if (parts.length === 2) {
        let h = parseInt(parts[0], 10);
        if (h < 12) {
          h += 12;
          out[key] = h + ':' + parts[1];
        }
      }
    }
  });
  return out;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function localDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

const PRAYER_NAMES = ['الفجر', 'الشروق', 'الظهر', 'العصر', 'المغرب', 'العشاء'];
const PRAYER_KEYS = ['fajr', 'shuruq', 'dhuhr', 'asr', 'maghrib', 'isha'];
const PRAYER_PERIODS = ['dawn', 'morning', 'midday', 'afternoon', 'maghrib', 'night'];

let activeTab = 'today';
let calYear, calMonth;
let refreshTimer = null;

function checkTimezone() {
  const offset = -new Date().getTimezoneOffset();
  if (offset !== 180) {
    const warn = document.createElement('div');
    warn.style.cssText = 'background:#c44b2b;color:white;text-align:center;padding:8px 12px;font-size:0.75rem;position:relative;z-index:5;';
    warn.textContent = '⚠️ المنطقة الزمنية ليست توقيت الأردن (UTC+3). المواقيت قد تكون غير دقيقة.';
    document.body.prepend(warn);
  }
  const lastDate = PRAYER_DATA && PRAYER_DATA.length ? PRAYER_DATA[PRAYER_DATA.length - 1].date : '';
  if (lastDate) {
    const now = new Date();
    const daysLeft = Math.ceil((new Date(lastDate + 'T23:59:59') - now) / 86400000);
    if (daysLeft <= 30 && daysLeft > 0) {
      const warn = document.createElement('div');
      warn.style.cssText = 'background:#b8860b;color:white;text-align:center;padding:8px 12px;font-size:0.75rem;position:relative;z-index:5;';
      warn.textContent = `⚠️ البيانات صالحة حتى ${lastDate} (${daysLeft} يوم متبقي). يرجى التحديث.`;
      document.body.prepend(warn);
    } else if (daysLeft <= 0) {
      const warn = document.createElement('div');
      warn.style.cssText = 'background:#c44b2b;color:white;text-align:center;padding:8px 12px;font-size:0.75rem;position:relative;z-index:5;';
      warn.textContent = '⚠️ بيانات المواقيت منتهية الصلاحية. يرجى تحديث التطبيق.';
      document.body.prepend(warn);
    }
  }
}

function init() {
  checkTimezone();
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();

  renderToday();
  startAutoRefresh();
  generateStars();
}

function getDayTimes(dateStr) {
  return PRAYER_MAP[dateStr] || null;
}

function getCurrentAndNextPrayer(times, dayOffset) {
  if (!times) return { current: '...', next: '...', nextTime: '...', secondsLeft: 0, currentName: '...', currentPeriod: 'night', isBeforeFajr: false, isAfterIsha: false };

  const now = new Date();
  const t = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const DAY = 24 * 3600;
  const offset = (dayOffset || 0) * DAY;

  const prayers = PRAYER_KEYS.map((key, i) => {
    const mins = timeToMinutes(times[key] || '00:00');
    return { key, name: PRAYER_NAMES[i], timeSecs: mins * 60 + offset, timeStr: times[key] || '...' };
  });

  const names = {};
  PRAYER_KEYS.forEach((k, i) => { names[k] = PRAYER_NAMES[i]; });

  if (t >= prayers[5].timeSecs) {
    return {
      current: 'العشاء',
      currentName: 'العشاء',
      next: 'الفجر',
      nextTime: prayers[0].timeStr,
      secondsLeft: (DAY - t) + prayers[0].timeSecs + offset,
      currentPeriod: 'night',
      isBeforeFajr: false,
      isAfterIsha: true
    };
  }

  for (let i = 0; i < prayers.length - 1; i++) {
    if (t >= prayers[i].timeSecs && t < prayers[i+1].timeSecs) {
      return {
        current: names[prayers[i].key],
        currentName: names[prayers[i].key],
        next: prayers[i+1].name,
        nextTime: prayers[i+1].timeStr,
        secondsLeft: prayers[i+1].timeSecs - t,
        currentPeriod: PRAYER_PERIODS[i],
        isBeforeFajr: false,
        isAfterIsha: false
      };
    }
  }

  return {
    current: 'العشاء',
    currentName: 'العشاء',
    next: 'الفجر',
    nextTime: prayers[0].timeStr,
    secondsLeft: prayers[0].timeSecs - t,
    currentPeriod: 'night',
    isBeforeFajr: true,
    isAfterIsha: false
  };
}

function timeToMinutes(timeStr) {
  const [h,m] = timeStr.split(':').map(Number);
  return (h||0)*60 + (m||0);
}

function formatCountdown(seconds) {
  seconds = Math.max(0, Math.round(seconds));
  if (seconds <= 0) return 'الآن';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function applyTheme(period) {
  const body = document.getElementById('body');
  const classes = ['dawn','morning','midday','afternoon','maghrib','night'];
  body.classList.remove(...classes);
  body.classList.add(period);

  const meta = document.querySelector('meta[name="theme-color"]');
  const colors = {
    dawn:'#1a1a3e', morning:'#4a90d9', midday:'#5b9bd5',
    afternoon:'#d4a54a', maghrib:'#2c1654', night:'#0a0a1a'
  };
  if (meta) meta.content = colors[period] || '#0a0a1a';

  const showStars = period === 'night' || period === 'dawn';
  const showSun = period === 'morning' || period === 'midday' || period === 'afternoon';
  const showMoon = period === 'night';

  document.getElementById('stars').classList.toggle('show', showStars);
  document.querySelector('.sun-glow').classList.toggle('show', showSun);
  document.querySelector('.moon-icon').classList.toggle('show', showMoon);
}

function getActiveDate() {
  const now = new Date();
  const today = localDateStr(now);
  const todayTimes = getDayTimes(today);
  if (!todayTimes) return today;

  const t = now.getHours() * 60 + now.getMinutes();
  const ishaMins = timeToMinutes(todayTimes.isha);

  if (t >= ishaMins) {
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowStr = localDateStr(tomorrow);
    if (getDayTimes(tomorrowStr)) return tomorrowStr;
  }
  return today;
}

function renderToday() {
  const activeDate = getActiveDate();
  const times = getDayTimes(activeDate);
  const today = localDateStr(new Date());
  const isNextDay = activeDate !== today;
  const info = getCurrentAndNextPrayer(times, isNextDay ? 1 : 0);

  applyTheme(info.currentPeriod || 'night');

  let html = '';

  html += `<div class="hero">`;
  if (times) {
    html += `<div class="current-name">${info.currentName || '...'}</div>`;
    html += `<div class="countdown" id="countdown" aria-live="polite">${formatCountdown(info.secondsLeft)}</div>`;
    html += `<div class="next-label">متبقي حتى أذان ${info.next} — ${esc(info.nextTime)}</div>`;
    if (isNextDay) {
      html += `<div class="hijri-date" style="margin-top:8px;color:var(--accent);">بعد أذان العشاء — مواقيت ${esc(activeDate)}</div>`;
    } else if (info.isAfterIsha) {
      html += `<div class="hijri-date" style="margin-top:8px;color:var(--accent);">بعد أذان العشاء</div>`;
    } else if (info.isBeforeFajr) {
      html += `<div class="hijri-date" style="margin-top:8px;color:var(--accent);">الليل — العشاء من اليوم السابق</div>`;
    }
    html += `<div class="hijri-date" style="margin-top:${(isNextDay||info.isAfterIsha||info.isBeforeFajr)?'4px':'10px'};">${esc(activeDate)}</div>`;
  } else {
    html += `<div class="current-name">...</div>`;
    html += `<div class="countdown">--:--</div>`;
    html += `<div class="next-label">المواقيت غير متوفرة لهذا التاريخ</div>`;
  }
  html += `</div>`;

  if (times) {
    html += `<div class="today-grid">`;
    PRAYER_KEYS.forEach((key, i) => {
      const isActive = !isNextDay && info.currentName === PRAYER_NAMES[i];
      html += `
        <div class="prayer-cell ${isActive?'active':''}">
          <div class="p-name">${PRAYER_NAMES[i]}</div>
          <div class="p-time">${times[key] ? esc(times[key]) : '...'}</div>
          ${isActive?`<span class="p-label">الوقت الحالي</span>`:''}
        </div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="loading">المواقيت غير متوفرة. قد تحتاج لتحديث التطبيق.</div>`;
  }

  html += `<div class="refresh-bar"><a href="https://www.awqaf.gov.jo/ar/Pages/PrayerTime" target="_blank" rel="noopener">المصدر: وزارة الأوقاف الأردنية</a> | عمّان</div>`;

  document.getElementById('mainScroll').innerHTML = html;
}

function renderMonth() {
  const now = new Date();
  if (!calYear) { calYear = now.getFullYear(); calMonth = now.getMonth(); }

  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const dows = ['سبت','أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة'];
  const todayStr = localDateStr(now);

  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth+1, 0);
  const daysInMonth = lastDay.getDate();
  let startDow = (firstDay.getDay() + 1) % 7;

  let html = '';

  html += `<div class="month-nav">
    <button onclick="calNav(-1)">→</button>
    <span class="month-label">${months[calMonth]} ${calYear}</span>
    <button onclick="calNav(1)">←</button>
  </div>`;

  html += `<div class="cal-grid">`;
  dows.forEach(d => { html += `<div class="cal-dow">${d}</div>`; });

  for (let i=0; i<startDow; i++) {
    html += `<div class="cal-cell empty"></div>`;
  }

  for (let d=1; d<=daysInMonth; d++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayTimes = PRAYER_MAP[key];
    const isToday = key === todayStr;
    const cls = ['cal-cell'];
    if (isToday) cls.push('today');

    const fajrTime = dayTimes ? dayTimes.fajr : '';

    html += `<div class="${cls.join(' ')}"${dayTimes?` role="button" tabindex="0" onclick="showDayDetail('${key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showDayDetail('${key}')}"`:''}>
      <span>${d}</span>
      ${fajrTime ? `<span class="cal-fajr">فجر ${esc(fajrTime)}</span>` : ''}
    </div>`;
  }
  html += `</div>`;

  html += `<div class="cal-legend">اضغط على أي يوم لعرض المواقيت</div>`;
  html += `<div class="refresh-bar"><a href="https://www.awqaf.gov.jo/ar/Pages/PrayerTime" target="_blank" rel="noopener">المصدر: وزارة الأوقاف الأردنية</a> | عمّان</div>`;

  document.getElementById('mainScroll').innerHTML = html;
}

function calNav(dir) {
  calMonth += dir;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderMonth();
}

function showDayDetail(dateStr) {
  const times = getDayTimes(dateStr);
  if (!times) return;

  const p = [
    { name:'الفجر', time:times.fajr },
    { name:'الشروق', time:times.shuruq },
    { name:'الظهر', time:times.dhuhr },
    { name:'العصر', time:times.asr },
    { name:'المغرب', time:times.maghrib },
    { name:'العشاء', time:times.isha },
  ];

  let html = `<div class="month-nav">
    <button onclick="renderMonth()">✕</button>
    <span class="month-label">${dateStr}</span>
    <span></span>
  </div>`;
  html += `<div class="today-grid">`;
  p.forEach(item => {
    html += `<div class="prayer-cell">
      <div class="p-name">${item.name}</div>
      <div class="p-time">${item.time ? esc(item.time) : '...'}</div>
    </div>`;
  });
  html += `</div>`;
  html += `<button style="display:block;margin:12px auto;padding:10px 30px;border-radius:24px;border:none;background:var(--surface-strong);color:var(--text);font-size:0.85rem;font-weight:600;cursor:pointer;-webkit-appearance:none;min-height:44px;font-family:inherit;" onclick="renderMonth()">رجوع</button>`;
  document.getElementById('mainScroll').innerHTML = html;
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('btnToday').classList.toggle('active', tab==='today');
  document.getElementById('btnMonth').classList.toggle('active', tab==='month');

  if (tab === 'today') renderToday();
  else if (tab === 'month') renderMonth();

  document.getElementById('mainScroll').scrollTop = 0;
}

function openCitySheet() {
  document.getElementById('citySheet').classList.add('open');
  document.getElementById('sheetBackdrop').classList.add('open');
}

function closeCitySheet() {
  document.getElementById('citySheet').classList.remove('open');
  document.getElementById('sheetBackdrop').classList.remove('open');
}

async function shareApp() {
  const url = window.location.href;
  const title = 'مواقيت الصلاة - الأردن';
  const text = 'تطبيق مواقيت الصلاة من وزارة الأوقاف الأردنية. يعمل بدون إنترنت، أضفه لشاشتك الرئيسية.';

  if (navigator.share) {
    try {
      await navigator.share({ title, text, url });
      return;
    } catch(e) {
      if (e.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(url);
    alert('تم نسخ الرابط! أرسله لأصدقائك.');
  } catch(e) {
    prompt('انسخ الرابط:', url);
  }
}

let lastPeriod = '';

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    if (activeTab === 'today') updateCountdownOnly();
  }, 1000);
}

function updateCountdownOnly() {
  const activeDate = getActiveDate();
  const times = getDayTimes(activeDate);
  if (!times) return;

  const today = localDateStr(new Date());
  const isNextDay = activeDate !== today;
  const info = getCurrentAndNextPrayer(times, isNextDay ? 1 : 0);
  const cd = document.getElementById('countdown');
  if (cd) cd.textContent = formatCountdown(info.secondsLeft);

  if (info.currentPeriod !== lastPeriod || info.secondsLeft <= 0) {
    lastPeriod = info.currentPeriod;
    renderToday();
  }
}

function generateStars() {
  const container = document.getElementById('stars');
  if (!container) return;
  let html = '<svg viewBox="0 0 400 300" style="width:100%;height:100%;">';
  html += '<defs><radialGradient id="sg"><stop offset="0%" stop-color="white" stop-opacity="0.9"/><stop offset="100%" stop-color="white" stop-opacity="0"/></radialGradient></defs>';
  for (let i=0; i<80; i++) {
    const x = Math.random() * 400;
    const y = Math.random() * 300;
    const r = 0.3 + Math.random() * 1.2;
    const o = 0.3 + Math.random() * 0.7;
    html += `<circle cx="${x}" cy="${y}" r="${r}" fill="white" opacity="${o}"/>`;
  }
  html += '</svg>';
  container.innerHTML = html;
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

document.addEventListener('DOMContentLoaded', init);
</script>
